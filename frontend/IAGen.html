<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Image Generator</title>
</head>
<body>

<h1>AI Image Generator</h1>

<input type="text" id="prompt" placeholder="Enter prompt">
<button onclick="generate()">Generate</button>

<br><br>

<img id="result" width="400" alt="Generated image result" title="Generated image"/>

<script>
async function generate() {
    const prompt = document.getElementById("prompt").value.trim();
    if (!prompt) {
        alert("Please enter a prompt first.");
        return;
    }

    const response = await fetch("http://127.0.0.1:8000/generate?prompt=" + encodeURIComponent(prompt), {
        method: "POST"
    });

    if (!response.ok) {
        const errorText = await response.text();
        alert("Generation failed: " + errorText);
        return;
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    document.getElementById("result").src = url;
}
</script>

</body>
</html>
